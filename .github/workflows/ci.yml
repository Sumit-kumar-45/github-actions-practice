name: CampusOS Practice CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project file
        run: |
          echo "GitHub Actions is working!"
          test -f index.html
          echo "index.html exists successfully!"